<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Triaje Dashboard Auto-Login</title>
</head>
<body style="margin:0; padding:0; overflow:hidden;">
  <iframe id="appFrame" src="../../pet_ct_triage/web_app/index.html" style="width:100vw; height:100vh; border:none;"></iframe>
  <script>
    const frame = document.getElementById('appFrame');
    frame.onload = function() {
      try {
        const frameDoc = frame.contentDocument || frame.contentWindow.document;
        const u = frameDoc.getElementById('loginUser');
        const p = frameDoc.getElementById('loginPass');
        const btn = frameDoc.querySelector('button[type="submit"]');
        if (u && p && btn) {
          u.value = 'triaje';
          p.value = 'triaje2026';
          btn.click();
        }
      } catch(e) {
        console.error(e);
      }
    };
  </script>
</body>
</html>
