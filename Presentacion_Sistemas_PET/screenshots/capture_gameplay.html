<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0; padding:0;">
  <iframe id="gameFrame" src="../../medicina-nuclear-game/index.html" style="width:100vw; height:100vh; border:none;"></iframe>
  <script>
    const f = document.getElementById('gameFrame');
    f.onload = function() {
      try {

      } catch(e) { console.error(e); }
    };
  </script>
