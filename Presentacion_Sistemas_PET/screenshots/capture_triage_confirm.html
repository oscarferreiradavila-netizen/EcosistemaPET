<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0; padding:0;">
  <iframe id="f" src="../../pet_ct_triage/web_app/index.html" style="width:100vw; height:100vh; border:none;"></iframe>
  <script>
    const frame = document.getElementById('f');
    frame.onload = function() {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        const u = doc.getElementById('loginUser');
        const p = doc.getElementById('loginPass');
        const btn = doc.querySelector('button[type="submit"]');
        if (u && p && btn) {
          u.value = 'triaje';
          p.value = 'triaje2026';
          btn.click();
          setTimeout(() => {
            const tabs = doc.querySelectorAll('.main-nav-tab, .tab-btn, button');
            tabs.forEach(t => {
              if (t.textContent && t.textContent.includes('Confirmaciones')) {
                t.click();
              }
            });
          }, 800);
        }
      } catch(e) { console.error(e); }
    };
  </script>
</body>
</html>
