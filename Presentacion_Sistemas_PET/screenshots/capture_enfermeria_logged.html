<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0; padding:0;">
  <iframe id="enf" src="../../pet_prep_page/enfermeria.html" style="width:100vw; height:100vh; border:none;"></iframe>
  <script>
    const frame = document.getElementById('enf');
    frame.onload = function() {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        const u = doc.getElementById('loginUser');
        const p = doc.getElementById('loginPass');
        const btn = doc.querySelector('button[type="submit"]');
        if (u && p && btn) {
          u.value = 'enfermeria';
          p.value = 'pet2026';
          btn.click();
        }
      } catch(e) { console.error(e); }
    };
  </script>
</body>
</html>
