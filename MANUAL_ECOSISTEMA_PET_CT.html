<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libro Maestro de Instrucciones y Manual de Operaciones — Ecosistema Digital PET/CT Galaria · SERGAS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    @page {
      size: A4;
      margin: 16mm 14mm 16mm 14mm;
      @bottom-right {
        content: counter(page);
        font-family: 'Outfit', sans-serif;
        font-size: 8pt;
        color: #64748b;
      }
    }
    
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1e293b;
      line-height: 1.55;
      font-size: 10pt;
      background: #ffffff;
      margin: 0;
      padding: 0;
    }

    /* BARRA SUPERIOR PARA PANTALLA */
    .screen-header {
      background: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 12px rgba(0, 43, 64, 0.05);
    }
    .screen-header-logos {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .screen-header-logos img {
      height: 38px;
      width: auto;
      object-fit: contain;
    }
    .screen-header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn-action {
      background: #007eb4;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 9pt;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: #004868;
    }
    .btn-outline {
      background: transparent;
      color: #004868;
      border: 1px solid #cbd5e1;
    }
    .btn-outline:hover {
      background: #f1f5f9;
    }

    /* CONTENEDOR PRINCIPAL */
    .manual-wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* PORTADA */
    .cover {
      page-break-after: always;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 250mm;
      padding: 25mm 20mm;
      background: linear-gradient(135deg, #002b40 0%, #004868 45%, #007eb4 100%);
      color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0, 43, 64, 0.35);
      margin-bottom: 30px;
    }
    .cover-logos {
      background: rgba(255, 255, 255, 0.96);
      padding: 16px 24px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }
    .cover-logos img {
      height: 42px;
      width: auto;
      object-fit: contain;
    }
    .cover-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fde047;
      color: #002b40;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 8.5pt;
      letter-spacing: 1.5px;
      padding: 5px 14px;
      border-radius: 30px;
      text-transform: uppercase;
      margin-top: 25px;
      margin-bottom: 12px;
    }
    .cover-title {
      font-family: 'Outfit', sans-serif;
      font-size: 32pt;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin: 32px 0 16px 0;
      color: #ffffff;
      text-shadow: 0 4px 25px rgba(0, 0, 0, 0.5), 0 0 35px rgba(0, 210, 255, 0.4);
    }
    .cover-subtitle {
      font-size: 13.5pt;
      font-weight: 500;
      color: #e0f2fe;
      line-height: 1.45;
      max-width: 720px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }
    .cover-scanner-box {
      position: relative;
      margin: 20px auto 10px auto;
      max-width: 680px;
      text-align: center;
    }
    .cover-scanner-img {
      display: block;
      width: 100%;
      max-height: 285px;
      object-fit: cover;
      object-position: 58% 48%;
      opacity: 0.78;
      filter: saturate(0.52) contrast(0.92) brightness(0.86);
      -webkit-mask-image: radial-gradient(ellipse 72% 68% at 54% 50%, rgba(0, 0, 0, 1) 24%, rgba(0, 0, 0, 0.55) 58%, rgba(0, 0, 0, 0) 92%);
      mask-image: radial-gradient(ellipse 72% 68% at 54% 50%, rgba(0, 0, 0, 1) 24%, rgba(0, 0, 0, 0.55) 58%, rgba(0, 0, 0, 0) 92%);
    }
    .cover-meta {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      padding: 16px 20px;
      margin-top: 24px;
    }
    .cover-meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      font-size: 9pt;
    }
    .cover-meta-item strong {
      display: block;
      color: #7dd3fc;
      font-family: 'Outfit', sans-serif;
      font-size: 8pt;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .cover-footer {
      font-size: 8.5pt;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    /* SALTOS DE PÁGINA Y CAPÍTULOS */
    .page-break {
      page-break-after: always;
    }
    .chapter {
      margin-bottom: 35px;
    }

    /* ENCABEZADOS */
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 18pt;
      font-weight: 800;
      color: #002b40;
      border-bottom: 2.5px solid #007eb4;
      padding-bottom: 6px;
      margin-top: 24px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 12.5pt;
      font-weight: 700;
      color: #004868;
      margin-top: 18px;
      margin-bottom: 8px;
      border-left: 4px solid #007eb4;
      padding-left: 8px;
    }
    h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 10.5pt;
      font-weight: 700;
      color: #1e293b;
      margin-top: 12px;
      margin-bottom: 6px;
    }
    p {
      margin: 0 0 10px 0;
      color: #334155;
      text-align: justify;
    }
    ul, ol {
      margin: 0 0 12px 0;
      padding-left: 22px;
      color: #334155;
    }
    li {
      margin-bottom: 4px;
    }

    /* CAJAS CALLOUT */
    .callout {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-left: 4.5px solid #007eb4;
      border-radius: 6px;
      padding: 10px 14px;
      margin: 12px 0;
      font-size: 9.5pt;
    }
    .callout-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      color: #004868;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .callout-alert {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-left: 4.5px solid #ef4444;
    }
    .callout-alert .callout-title {
      color: #991b1b;
    }
    .callout-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-left: 4.5px solid #16a34a;
    }
    .callout-success .callout-title {
      color: #166534;
    }
    .callout-warning {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-left: 4.5px solid #d97706;
    }
    .callout-warning .callout-title {
      color: #92400e;
    }

    /* TABLAS */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 16px 0;
      font-size: 9pt;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 7px 10px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f8fafc;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      color: #002b40;
    }
    tr:nth-child(even) td {
      background: #fbfcfe;
    }

    /* BADGES Y PILLS */
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 8pt;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }
    .badge-p1 { background: #fee2e2; color: #991b1b; }
    .badge-p2 { background: #fef3c7; color: #92400e; }
    .badge-p3 { background: #e0f2fe; color: #0369a1; }
    .badge-role { background: #ede9fe; color: #6d28d9; }

    /* TARJETAS RESUMEN DE MÓDULOS */
    .module-hero-card {
      background: linear-gradient(135deg, #f8fafc 0%, #f0f9ff 100%);
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 14px 18px;
      margin: 14px 0;
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 16px;
      align-items: center;
    }
    .module-hero-icon {
      font-size: 38pt;
      text-align: center;
      line-height: 1;
    }
    .module-hero-desc strong {
      display: block;
      color: #004868;
      font-family: 'Outfit', sans-serif;
      font-size: 11pt;
      margin-bottom: 3px;
    }
    .module-hero-desc span {
      color: #475569;
      font-size: 9pt;
    }

    /* WORKFLOW STEPS */
    .step-list {
      counter-reset: step-counter;
      list-style: none;
      padding: 0;
      margin: 14px 0;
    }
    .step-list li {
      counter-increment: step-counter;
      position: relative;
      padding-left: 36px;
      margin-bottom: 10px;
    }
    .step-list li::before {
      content: counter(step-counter);
      position: absolute;
      left: 0;
      top: 0;
      width: 24px;
      height: 24px;
      background: #007eb4;
      color: #ffffff;
      border-radius: 50%;
      text-align: center;
      line-height: 24px;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 8.5pt;
    }

    /* ÍNDICE INTERACTIVO */
    .toc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }
    .toc-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #004868;
      font-weight: 600;
      font-size: 9pt;
      transition: all 0.2s;
    }
    .toc-item:hover {
      background: #e0f2fe;
      border-color: #38bdf8;
    }
    .toc-num {
      background: #007eb4;
      color: #ffffff;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      text-align: center;
      line-height: 22px;
      font-family: 'Outfit', sans-serif;
      font-size: 8pt;
      font-weight: 800;
      flex-shrink: 0;
    }

    @media print {
      .screen-header { display: none; }
      .manual-wrapper { max-width: 100%; padding: 0; }
      .cover { min-height: 270mm; margin-bottom: 0; border-radius: 0; }
    }
  </style>
</head>
